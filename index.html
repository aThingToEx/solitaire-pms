<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klondike Solitaire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Klondike Solitaire</h1>
  <div class="toolbar">
    <label class="tilt-toggle"><input type="checkbox" id="tiltToggle"> Tilt</label>
    <span id="moveCounter" class="move-counter">Moves: 0</span>
    <button id="undoBtn">Undo</button>
    <input id="seedInput" class="seed-input" type="text" placeholder="Seed" />
    <button id="dealSeedBtn">Deal Seed</button>
    <span id="status"></span>
    <button id="newGameBtn">New Game</button>
  </div>
</header>

<main>
  <section id="solitaire"></section>
</main>

<footer>Click a card to select it, click a pile to move it there.</footer>

<script src="js/cards.js"></script>
<script src="js/solitaire.js"></script>
<script src="js/main.js"></script>
</body>
</html>
